html{scroll-behavior:smooth}

.topbar-inner{position:relative;z-index:2;max-width:680px;margin:0 auto}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px}
.brand-icon{width:50px;height:50px;background:#fff;border-radius:14px;display:grid;place-items:center;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.15);flex-shrink:0}
.brand-name{font-weight:900;font-size:20px;letter-spacing:-.5px;line-height:1.1}
.brand-name span{display:block;font-size:11px;font-weight:600;opacity:.9;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
.lang-toggle{display:flex;background:rgba(255,255,255,.18);border-radius:999px;padding:4px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);flex-shrink:0}

.lang-toggle button.active{background:#fff;color:var(--red);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tagline{font-size:12.5px;font-weight:700;letter-spacing:.6px;margin-top:20px;opacity:.95;text-transform:uppercase}
.headline{font-size:27px;font-weight:900;letter-spacing:-.8px;margin-top:4px;line-height:1.15}
.location{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;backdrop-filter:blur(4px)}
.search-wrap{position:relative;margin-top:18px;z-index:3}
.search-wrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#999}
body[dir="rtl"] .search-wrap svg{left:auto;right:15px}
.search-wrap input{width:100%;padding:14px 16px 14px 44px;border:none;border-radius:14px;font-size:14px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.12);outline:none;background:#fff;color:var(--ink)}
body[dir="rtl"] .search-wrap input{padding:14px 44px 14px 16px}
.search-wrap input::placeholder{color:#aaa}

.nav-wrap{position:sticky;top:0;z-index:50;background:rgba(255,250,243,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-scroll{display:flex;gap:8px;overflow-x:auto;padding:11px 16px;max-width:720px;margin:0 auto;scrollbar-width:none}
.nav-scroll::-webkit-scrollbar{display:none}

.nav-pill .em{font-size:15px}
.nav-pill.active{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 12px rgba(230,57,70,.3)}

main{max-width:720px;margin:0 auto;padding:6px 16px 120px}
.cat{padding-top:30px;scroll-margin-top:70px}

.banner{width:100%;height:120px;object-fit:cover;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}

.price{color:var(--red);font-weight:900;font-size:15px;white-space:nowrap}

/* banners mapping */
const BANNERS = {
  burgers:"burger-3.jpg", crogers:"croger-1.jpg", starvation:"starvation-3.jpg",
  tacos:"tacos-2.jpg", sandwichs:"sandwich-2.jpg", pates:"pasta-2.jpg",
  smash:"smash-2.jpg", smashcroger:"smash-1.jpg", extras:"fries-2.jpg"
};

/* ===================== I18N ===================== */
const T = {
  fr:{tagline:"FRAIS · GÉNÉREUX · FAIT POUR TOI",headline:"T'as faim ? On s'occupe de toi.",location:"Bab Ezzouar, Alger",hours:"11h – 23h",searchPh:"Rechercher un plat ou un ingrédient…",footer:"Frais · Généreux · Fait pour toi — Bab Ezzouar, Alger",items:"plats",noResults:"Aucun plat trouvé",noResultsSub:"Essaie un autre mot-clé ou ingrédient.",view:"Voir le plat",call:"Commander par téléphone",currency:"DA",simple:"Simple",double:"Double",triple:"Triple",added:"Menu prêt !"},
  ar:{tagline:"طازج · سخي · مصنوع من أجلك",headline:"جعان؟ خلّي علينا!",location:"باب الزوار، الجزائر",hours:"11ص – 11م",searchPh:"ابحث عن طبق أو مكوّن…",footer:"طازج · سخي · مصنوع من أجلك — باب الزوار، الجزائر",items:"أطباق",noResults:"لم يتم العثور على أطباق",noResultsSub:"جرّب كلمة أو مكوّن آخر.",view:"شاهد الطبق",call:"اطلب عبر الهاتف",currency:"د.ج",simple:"عادي",double:"مزدوج",triple:"ثلاثي",added:"تم التحضير!"}
};

let lang = localStorage.getItem('imstarving-lang') || 'fr';
let filtered = null;
let activeCat = null;

function setLang(l){
  lang = l;
  localStorage.setItem('imstarving-lang', l);
  document.documentElement.lang = l;
  document.documentElement.dir = l==='ar'?'rtl':'ltr';
  document.body.dir = l==='ar'?'rtl':'ltr';
  document.getElementById('btnFr').classList.toggle('active', l==='fr');
  document.getElementById('btnAr').classList.toggle('active', l==='ar');
  applyStaticI18n();
  render();
  closeModal();
}
function t(k){ return T[lang][k]||T.fr[k]||k; }
function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  const s=document.getElementById('search'); s.placeholder=t('searchPh');
}
function itemName(d){ return lang==='ar'? d.ar.n : d.fr.n; }
function itemDesc(d){ return lang==='ar'? d.ar.d : d.fr.d; }
function sizeLabel(lbl){
  const m={Simple:t('simple'),Double:t('double'),Triple:t('triple'),M:'M',L:'L',XL:'XL',XXL:'XXL'};
  return m[lbl]||lbl;
}
function price(v){ return lang==='ar' ? v.toLocaleString('fr-FR')+' '+t('currency') : v+' '+t('currency'); }

/* ===================== RENDER ===================== */
function buildNav(cats){
  const nav=document.getElementById('nav');
  nav.innerHTML = cats.map(c=>`<button class="nav-pill" data-cat="${c}" onclick="goCat('${c}')"><span class="em">${C[c].em}</span><span>${lang==='ar'?C[c].ar:C[c].fr}</span></button>`).join('');
}
function getCats(){
  const order=['burgers','crogers','starvation','tacos','sandwichs','pates','smash','smashcroger','extras'];
  return order.filter(c=>MENU.some(d=>d.cat===c));
}
function matchSearch(d,q){
  if(!q) return true;
  q=q.trim().toLowerCase();
  const hay=[itemName(d),itemDesc(d),d.fr.n,d.fr.d,d.fr.ing||'',d.ar.n,d.ar.d].join(' ').toLowerCase();
  return q.split(/\s+/).every(w=>hay.includes(w));
}
function render(){
  const q=document.getElementById('search').value||'';
  const list=MENU.filter(d=>matchSearch(d,q));
  const cats=getCats().filter(c=>list.some(d=>d.cat===c));
  buildNav(cats);
  const main=document.getElementById('menu');
  if(!list.length){
    main.innerHTML=`<div class="empty"><span class="em">🔍</span><div style="font-size:17px;font-weight:800">${t('noResults')}</div><div style="font-size:13px;margin-top:6px">${t('noResultsSub')}</div></div>`;
    updateSpy([]); return;
  }
  main.innerHTML = cats.map(c=>{
    const items=list.filter(d=>d.cat===c);
    const cname=lang==='ar'?C[c].ar:C[c].fr;
    return `<section class="cat" id="cat-${c}">
      <div class="cat-head"><div class="cat-icon">${C[c].em}</div><div class="cat-title">${cname}</div><div class="cat-count">${items.length} ${t('items')}</div></div>
      ${q?'':`<img class="banner" src="assets/${BANNERS[c]}" alt="${cname}" loading="lazy">`}
      ${items.map((d,i)=>dishHTML(d,i)).join('')}
    </section>`;
  }).join('');
  const ids=cats.map(c=>'cat-'+c);
  observeSections(ids);
  updateSpy(ids);
}
function dishHTML(d,i){
  const idx=MENU.indexOf(d);
  const first=d.sizes[0];
  const sizesHTML=d.sizes.length>1?`<div class="sizes">${d.sizes.map(s=>`<span class="size">${sizeLabel(s[0])} <b>${price(s[1])}</b></span>`).join('')}</div>`:'';
  return `<article class="dish ${d.img?'':'no-photo'}" onclick="openModal(${idx})">
    ${d.badge?`<span class="badge">${d.badge}</span>`:''}
    <img class="dish-thumb" src="assets/${d.img}" alt="${itemName(d)}" loading="lazy" onerror="this.style.display='none'">
    <div class="dish-body">
      <div class="dish-top"><div class="dish-name">${itemName(d)}</div></div>
      <div class="dish-desc">${itemDesc(d)}</div>
      <div class="dish-bottom"><div><div class="price">${price(first[1])}</div>${sizesHTML}</div></div>
    </div>
    <span class="arrow">›</span>
  </article>`;
}

/* ===================== SCROLLSPY ===================== */
let observer=null;
function observeSections(ids){
  if(observer) observer.disconnect();
  observer=new IntersectionObserver(entries=>{
    const vis=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
    if(vis.length) updateSpy(vis.map(e=>e.target.id));
  },{rootMargin:'-70px 0px -65% 0px',threshold:0});
  ids.forEach(id=>{const el=document.getElementById(id);if(el)observer.observe(el);});
}
function updateSpy(ids){
  const cur=ids[0];
  document.querySelectorAll('.nav-pill').forEach(p=>p.classList.toggle('active',p.dataset.cat===cur?.replace('cat-','')));
  const active=document.querySelector('.nav-pill.active');
  if(active) active.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}
function goCat(c){
  const el=document.getElementById('cat-'+c);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ===================== MODAL ===================== */
function openModal(idx){
  const d=MENU[idx];
  const cname=lang==='ar'?C[d.cat].ar:C[d.cat].fr;
  const sizes=d.sizes.map(s=>`<div class="modal-size"><div class="lbl">${sizeLabel(s[0])}</div><div class="val">${price(s[1])}</div></div>`).join('');
  document.getElementById('modal').innerHTML=`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <img class="modal-img" src="assets/${d.img}" alt="${itemName(d)}" onerror="this.className='modal-img emoji-fallback';this.textContent='${C[d.cat].em}'">
    <div class="modal-inner">
      <div class="modal-cat">${C[d.cat].em} ${cname}</div>
      <div class="modal-name">${itemName(d)}</div>
      <div class="modal-desc">${itemDesc(d)}</div>
      <div class="modal-sizes">${sizes}</div>
      <a class="modal-cta" href="tel:+213659564611">📞 ${t('call')}</a>
    </div>`;
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ===================== EVENTS ===================== */
document.getElementById('search').addEventListener('input',render);
window.addEventListener('hashchange',()=>closeModal());

/* init */
applyStaticI18n();
render();
</script>
